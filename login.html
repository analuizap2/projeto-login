<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/style.css">
    <title>login</title>
</head>
<body>
    <main>
        <section id="login">
            <div class="imagem">
            </div>
            <div class="formulario">
                <h1>Login</h1>
                <p>Bem-vindo (a) de volta ou resgitra-se</p>
                <form action="login.php" method="post">

                    <div class="campo">
                        <label for="iemail">E-mail:</label>
                        <input type="email" id="iemail" placeholder="E-mail" autocomplete="email" minlength="8" required>
                    </div>
                    
                    <div class="campo">
                        <label for="isenha">Senha:</label>
                        <input type="password" name="Senha" id="isenha" placeholder="Senha" autocomplete="current-password" minlength="8" required>
                    </div>
                    <input type="submit" value="Entrar">
                    <a href="resgitra-se.html" class="botao">Registra-se</a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
